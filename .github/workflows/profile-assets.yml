name: Refresh profile assets
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_profile_assets.py
      - .github/workflows/profile-assets.yml
permissions:
  contents: write
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate public profile cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile_assets.py
      - name: Save refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats-*.svg assets/languages-*.svg assets/activity-*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh profile statistics'
          git pull --rebase origin main
          git push origin HEAD:main
