<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Quartz — Build tools. Automate work. Explore ideas.">
<title>Quartz — Build tools. Automate work. Explore ideas.</title>
<defs><linearGradient id="accent"><stop stop-color="#58a6ff"/><stop offset="1" stop-color="#39d3bb"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#30363d" stroke-opacity=".28"/></pattern><clipPath id="typing"><rect width="690" height="35" class="typing"/></clipPath></defs>
<style>
svg{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.cursor{animation:blink 1s steps(2,end) infinite}.typing{animation:type 7s steps(47,end) infinite}.orbit{transform-origin:773px 112px;animation:orbit 18s linear infinite}.flow{stroke-dasharray:6 14;animation:flow 3s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes blink{50%{opacity:0}}@keyframes type{0%,8%{width:0}50%,92%{width:690}100%{width:0}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes pulse{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.cursor,.typing,.orbit,.flow,.pulse{animation:none}}
</style>
<rect x=".5" y=".5" width="899" height="239" rx="18" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="898" height="238" rx="18" fill="url(#grid)"/>
<circle cx="28" cy="25" r="4" fill="#f78166"/><circle cx="44" cy="25" r="4" fill="#f2cc60"/><circle cx="60" cy="25" r="4" fill="#39d3bb"/>
<text x="82" y="29" fill="#8b949e" font-size="11">quartz / workspace</text>
<text x="34" y="104" fill="#e6edf3" font-size="54" font-weight="700" letter-spacing="-2">Hi, I'm Quartz<tspan fill="#39d3bb">.</tspan></text>
<g transform="translate(36 125)"><g clip-path="url(#typing)"><text y="22" fill="#8b949e" font-size="17">Build tools. Automate work. Explore ideas.</text></g></g>
<text x="36" y="201" fill="#58a6ff" font-size="13">$ <tspan fill="#c9d1d9">code · vision · embedded · creative</tspan></text><rect class="cursor" x="374" y="188" width="8" height="16" fill="#39d3bb"/>
<circle cx="773" cy="112" r="65" fill="#0d1117" stroke="#30363d"/>
<circle class="flow" cx="773" cy="112" r="52" fill="none" stroke="url(#accent)" stroke-width="2"/>
<g class="orbit"><circle cx="773" cy="47" r="5" fill="#58a6ff"/><circle cx="773" cy="177" r="4" fill="#39d3bb"/></g>
<text x="773" y="126" text-anchor="middle" fill="#e6edf3" font-size="37" font-weight="700">&lt;/&gt;</text>
<circle class="pulse" cx="850" cy="200" r="4" fill="#39d3bb"/>
</svg>